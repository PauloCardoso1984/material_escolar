<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Matemática - Prof. Paulo Cardoso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho com Perfil do Professor Paulo Cardoso -->
    <header class="teacher-header">
        <div class="header-container">
            <img src="imagem/brasil.png" alt="Foto do Professor Paulo Cardoso" class="teacher-photo" onerror="this.src='https://placeholder.com'">
            <div class="teacher-info">
                <h1>Prof. Paulo Cardoso</h1>
                <p>Bem-vindo ao nosso portal de Matemática. Selecione a sua série abaixo, assista à videoaula explicativa e realize o download das 20 atividades em PDF preparadas para cada tema!</p>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal: Gerado dinamicamente via JS (6º Ano ao 3º Médio) -->
    <main class="main-content" id="series-container"></main>

    <!-- Janela Modal para Exibição do Vídeo e das 20 Atividades -->
    <div id="content-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-modal">&times;</span>
            <h2 id="modal-title">Tema</h2>
            
            <div class="modal-body">
                <!-- Seção de Vídeo Ajustada -->
                <div class="video-section">
                    <h3><span class="icon">🎥</span> Videoaula Explicativa</h3>
                    <div class="video-wrapper">
                        <iframe id="modal-video" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                </div>

                <!-- Seção das Atividades em PDF -->
                <div class="activities-section">
                    <h3><span class="icon">📄</span> Atividades Complementares (20 Exercícios em PDF)</h3>
                    <ul id="modal-activities-list" class="activities-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
